apiVersion: v1
kind: Namespace
metadata:
  name: ial
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ial-admin
  namespace: ial
  labels:
    app: ial-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ial-admin
  template:
    metadata:
      labels:
        app: ial-admin
    spec:
      containers:
        - name: admin
          image: ial-website-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: ADMIN_ONLY
              value: "true"
            # Override the pod hostname so Next listens on all interfaces.
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef:
                name: ial-admin
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ial-admin
  namespace: ial
  labels:
    app: ial-admin
spec:
  selector:
    app: ial-admin
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ial-admin
  namespace: ial
  labels:
    app: ial-admin
spec:
  ingressClassName: nginx
  rules:
    - host: admin.inzight.co.nz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ial-admin
                port:
                  name: http
  tls:
    - hosts:
        - admin.inzight.co.nz
      secretName: ial-admin-tls
