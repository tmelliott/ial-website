# Build site and Strapi images on GitHub-hosted runners and pin the digest
# on inzight-analytics/ial-server with a git push. Runs on strapi-admin-trial.
#
# Secrets in tmelliott/ial-website. GHCR_TOKEN and IAL_SERVER_TOKEN are the
# same Kaniko PAT: it can push packages and git, and GitHub returns 401 when
# that PAT calls the repository_dispatch API.
#   GHCR_USERNAME, GHCR_TOKEN, IAL_SERVER_TOKEN
name: Build images

on:
  workflow_dispatch:
  push:
    branches: [strapi-admin-trial]
    paths:
      - "site/**"
      - "public/**"
      - "admin/**"
      - ".github/workflows/build-images.yml"

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
      strapi: ${{ steps.filter.outputs.strapi }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "strapi=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only HEAD^ HEAD)
          site=false
          strapi=false
          if echo "$files" | grep -Eq '^(site/|public/|\.github/workflows/build-images\.yml$)'; then
            site=true
          fi
          if echo "$files" | grep -Eq '^(admin/|\.github/workflows/build-images\.yml$)'; then
            strapi=true
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "strapi=$strapi" >> "$GITHUB_OUTPUT"

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./site
          file: ./site/Dockerfile
          push: true
          build-contexts: |
            assets=./public
          tags: ghcr.io/inzight-analytics/ial-website-site:${{ github.sha }}
      - name: Pin the digest on ial-server
        env:
          TOKEN: ${{ secrets.IAL_SERVER_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
          APP: ial-website-site
        run: bash .github/scripts/pin-digest.sh

  strapi:
    needs: changes
    if: needs.changes.outputs.strapi == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./admin
          file: ./admin/Dockerfile
          push: true
          tags: ghcr.io/inzight-analytics/ial-website-strapi:${{ github.sha }}
      - name: Pin the digest on ial-server
        env:
          TOKEN: ${{ secrets.IAL_SERVER_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
          APP: ial-website-strapi
        run: bash .github/scripts/pin-digest.sh
