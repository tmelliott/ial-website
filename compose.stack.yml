# Local Strapi + Astro stack.
# Dev (source mounted):  docker compose -f compose.stack.yml --profile dev up
# Built images:          docker compose -f compose.stack.yml --profile built up
# Postgres has no profile. The two app profiles are separate, so one command
# does not start both a dev process and its image.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi
    ports:
      - "5434:5432"
    volumes:
      - strapi-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  strapi-dev:
    profiles: ["dev"]
    build:
      context: ./admin
    ports:
      - "1337:1337"
    env_file:
      - ./admin/.env
    environment:
      HOME: /home/node
      HOST: 0.0.0.0
      PORT: "1337"
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      DATABASE_SSL: "false"
      SEED_MOCK: "true"
      CLIENT_URL: http://localhost:4321
      STRAPI_URL: http://localhost:1337
      SITE_PURGE_URL: http://site-dev:4321/api/purge
      PURGE_SECRET: ${PURGE_SECRET:-}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
    volumes:
      - ./admin:/opt/app
      - strapi-node-modules:/opt/app/node_modules
    command: ["npm", "run", "develop"]
    depends_on:
      postgres:
        condition: service_healthy

  site-dev:
    profiles: ["dev"]
    build:
      context: ./site
      additional_contexts:
        assets: ./public
    ports:
      - "4321:4321"
    environment:
      HOME: /home/node
      HOST: 0.0.0.0
      PORT: "4321"
      STRAPI_URL: http://localhost:1337
      STRAPI_INTERNAL_URL: http://strapi-dev:1337
      CLIENT_URL: http://localhost:4321
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      PURGE_SECRET: ${PURGE_SECRET:-}
      GMAIL_EMAIL_HOST: ${GMAIL_EMAIL_HOST:-smtp.gmail.com}
      GMAIL_EMAIL_PORT: ${GMAIL_EMAIL_PORT:-587}
      GMAIL_EMAIL_ADDRESS: ${GMAIL_EMAIL_ADDRESS:-}
      GMAIL_EMAIL_PASSWORD: ${GMAIL_EMAIL_PASSWORD:-}
    volumes:
      - ./site:/app
      - site-node-modules:/app/node_modules
    # The dev lock lives on the bind mount. Container PIDs restart from 1, so a
    # previous container's pid can look alive and Astro then refuses to start.
    command: ["sh", "-c", "rm -f .astro/dev.json && exec npm run dev -- --host 0.0.0.0 --port 4321"]
    depends_on:
      - strapi-dev

  strapi:
    profiles: ["built"]
    build:
      context: ./admin
    ports:
      - "1337:1337"
    env_file:
      - ./admin/.env
    environment:
      HOME: /home/node
      HOST: 0.0.0.0
      PORT: "1337"
      NODE_ENV: production
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      DATABASE_SSL: "false"
      CLIENT_URL: http://localhost:4321
      STRAPI_URL: http://localhost:1337
      SITE_PURGE_URL: http://site:4321/api/purge
      PURGE_SECRET: ${PURGE_SECRET:-}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
    volumes:
      - strapi-uploads:/opt/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  site:
    profiles: ["built"]
    build:
      context: ./site
      additional_contexts:
        assets: ./public
    ports:
      - "4321:4321"
    environment:
      HOME: /home/node
      HOST: 0.0.0.0
      PORT: "4321"
      NODE_ENV: production
      STRAPI_URL: http://localhost:1337
      STRAPI_INTERNAL_URL: http://strapi:1337
      CLIENT_URL: http://localhost:4321
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN:-}
      PREVIEW_SECRET: ${PREVIEW_SECRET:-}
      PURGE_SECRET: ${PURGE_SECRET:-}
      GMAIL_EMAIL_HOST: ${GMAIL_EMAIL_HOST:-smtp.gmail.com}
      GMAIL_EMAIL_PORT: ${GMAIL_EMAIL_PORT:-587}
      GMAIL_EMAIL_ADDRESS: ${GMAIL_EMAIL_ADDRESS:-}
      GMAIL_EMAIL_PASSWORD: ${GMAIL_EMAIL_PASSWORD:-}
    depends_on:
      - strapi

volumes:
  strapi-pg:
  strapi-node-modules:
  site-node-modules:
  strapi-uploads:
