services:
  web:
    build:
      context: .
      secrets:
        - dotenv
      args:
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-https://inzight.co.nz}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - ADMIN_ONLY=true
      - HOSTNAME=0.0.0.0

secrets:
  dotenv:
    file: .env
