# Connect this as its own Netlify site with base directory site/.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # These values are public: the Gmail SMTP host fallback in the contact
  # function, and the support address published on the privacy page.
  # GMAIL_EMAIL_PASSWORD stays in the scan.
  SECRETS_SCAN_OMIT_KEYS = "GMAIL_EMAIL_HOST,GMAIL_EMAIL_ADDRESS"

[images]
  remote_images = ['https://admin\.inzight\.co\.nz/.*']

# Runs after the deploy is live. Warming earlier would fill a cache that
# the new deploy then throws away.
[[plugins]]
  package = "./plugins/warm-cache"

[[redirects]]
  from = "/keywords/horizon-europe"
  to = "/horizon-europe"
  status = 301

[[redirects]]
  from = "/projects/political-polling-guide"
  to = "/projects/understanding-public-opinion-polls-in-new-zealand"
  status = 301

[[redirects]]
  from = "/projects/matau"
  to = "/apps#matau"
  status = 301

[[redirects]]
  from = "/projects/page/1"
  to = "/projects"
  status = 301
