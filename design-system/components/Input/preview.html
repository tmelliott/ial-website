<link rel="stylesheet" href="../../tokens.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;font-family:var(--font-sans);color:var(--black);background:var(--white);}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-4);padding:var(--space-4);}
  .dark{background:linear-gradient(170deg,var(--bg-gradient-start) 15%,var(--bg-gradient-end) 125%);}
  .f{display:grid;gap:var(--space-2);padding:var(--space-4) var(--space-4) 0;max-width:420px;}
  label{font-size:.875rem;line-height:1.4286;font-weight:600;}
  input{font:inherit;font-size:1rem;line-height:1.5;padding:var(--space-2) var(--space-4);border:var(--border-width) solid var(--gray-500);border-radius:var(--radius);outline:0;}
  input:focus,input.focus{border-color:var(--accent-600);box-shadow:0 0 0 3px var(--accent-200);}
</style>
<div class="f"><label for="a">Name</label><input id="a" placeholder="Your name"></div>
<div class="f"><label for="b">Email</label><input id="b" class="focus" value="name@example.com"></div>
